[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nortonghost"
version = "1.0.0"
description = "Read and recover files from Symantec/Norton Ghost .v2i disk images"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Craig Beech" }]
keywords = [
    "v2i",
    "sv2i",
    "ghost",
    "backup",
    "recovery",
    "forensics",
    "ntfs",
    "disk-image",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Archiving :: Backup",
    "Topic :: System :: Recovery Tools",
    "Topic :: Utilities",
]
dependencies = [
    "rich>=13.7",
]

[project.urls]
Homepage = "https://github.com/cbeech/nortonghost"
Repository = "https://github.com/cbeech/nortonghost"
Issues = "https://github.com/cbeech/nortonghost/issues"
"Format notes" = "https://github.com/cbeech/nortonghost/blob/main/docs/format-notes.md"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
nortonghost = "nortonghost.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
